[workspace]
name = "igvf-tf-chrombpnet"
description = "ChromBPNet pipeline for the IGVF TF collaboration"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64"]

# Scope: pixi covers local development only — linting, syntax checks, and
# running the QC/plotting scripts on results copied off the cluster.
#
# It deliberately does NOT reproduce the three cluster environments. The
# chrombpnet stack pins tensorflow==2.8.0 / numpy==1.23.4 / keras==2.8.0 as pip
# dependencies with CUDA 11 wheels; finemo and MotifCompendium pin mutually
# incompatible torch and cupy builds. Those three stay canonical in envs/*.yml
# as fully pinned conda exports and are created with `conda env create`.
# See CLAUDE.md, "Environments".

[dependencies]
python = ">=3.12,<3.14"

[feature.dev.dependencies]
ruff = "*"
shellcheck = "*"
pre-commit = "*"
bash = ">=5.2.37,<6"
pytest = ">=9.1.1,<10"

[feature.qc.dependencies]
pytest = "*"
numpy = ">=1.23"
pandas = ">=2.0"
scipy = ">=1.10"
matplotlib = ">=3.7"
h5py = ">=3.8"
pysam = ">=0.24.1,<0.25"
duckdb = ">=1.5.5,<2"
click = ">=8.5.0,<9"
pyyaml = ">=6.0.3,<7"
bedtools = ">=2.31.1,<3"
ucsc-bedgraphtobigwig = ">=482,<483"
pybigwig = ">=0.3.26,<0.4"
pybigtools = ">=0.3.0,<0.4"
pyfaidx = ">=0.9.0.4,<0.10"

[feature.qc.pypi-dependencies]
pyranges1 = ">=1.4"

# The `preprocess` cluster environment, reproduced. This is the ONE of the four
# that pixi can reproduce faithfully: steps 00.0/00.1/02.0 and the reference
# builder need only interval/table/bigwig work, with no deep-learning stack and
# no CUDA wheels, so there is nothing here that pins a GPU build. Mirrors
# envs/preprocess.yml dependency for dependency -- keep the two in step.
#
# This does NOT contradict "pixi deliberately does not reproduce the cluster
# environments": that rule is about chrombpnet / finemo / motif_compendium,
# which pin mutually incompatible tensorflow, torch and cupy builds. On molab
# those come from the container instead (see workflows/molab/).
[feature.preprocess.dependencies]
python = ">=3.12,<3.14"
pandas = ">=2.0"
numpy = ">=1.23"
pybigtools = ">=0.3"      # Rust bigWig writer for the cut-site pileup
pysam = ">=0.22"          # bgzip writing + tabix indexing
pyfaidx = ">=0.7"         # utils/shift.py, Tn5 shift auto-detection
matplotlib-base = ">=3.7" # utils/plotting.py; -base on purpose, Agg backend
pybigwig = ">=0.3"        # utils/qc.py READS bigwigs (distinct from pybigtools)
click = ">=8.1"           # the src/cli.py command group
pyyaml = ">=6"            # full YAML for config.py

[feature.preprocess.pypi-dependencies]
pyranges1 = ">=1.4"       # not on conda-forge/bioconda; conda's is the 0.x line

# The `motifs` environment (03.3, 04.5): TF-MoDISco 2.5.2, whose memelite
# dependency needs Python >= 3.9 -- the chrombpnet env cannot have it. Mirrors
# envs/motifs.yml -- keep the two in step. Its own solve group so it cannot
# move the versions the other environments get.
[feature.motifs.dependencies]
python = ">=3.12,<3.14"
numpy = ">=1.23"
pandas = ">=2.0"
scipy = ">=1.10"
h5py = ">=3.8"
hdf5plugin = ">=4.0"     # chrombpnet's scores h5 is filter-compressed
matplotlib-base = ">=3.7"
numba = ">=0.58"
scikit-learn = ">=1.3"
python-igraph = ">=0.10"
leidenalg = ">=0.10"
pyfaidx = ">=0.7"
jinja2 = ">=3.1"
logomaker = ">=0.8"
pyyaml = ">=6"

[feature.motifs.pypi-dependencies]
modisco = "==2.5.2"
memelite = ">=0.4"       # tomtom-lite, used by `modisco report -l`

[environments]
default = { features = ["dev"], solve-group = "main" }
qc = { features = ["qc"], solve-group = "main" }
preprocess = { features = ["preprocess"], solve-group = "main" }
motifs = { features = ["motifs"], solve-group = "motifs" }

[tasks.lint]
description = "ruff check over lib/ and src/"
cmd = "ruff check lib/python src"

[tasks.fmt-check]
description = "ruff format --diff (does not write)"
cmd = "ruff format --diff lib/python src"

[tasks.fmt]
description = "ruff format (writes)"
cmd = "ruff format lib/python src"

[tasks.check-bash]
description = "bash -n + shellcheck over every workflow step and bash lib"
cmd = """
bash -c '
set -e
for f in workflows/SLURM/*.sh workflows/molab/*.sh lib/bash/*.sh; do bash -n "$f"; done
echo "bash -n: OK"
shellcheck -S warning workflows/SLURM/*.sh workflows/molab/*.sh lib/bash/*.sh
'
"""

[tasks.check-py]
description = "byte-compile every Python file (no cluster imports needed)"
cmd = "python -m compileall -q lib/python src"

[tasks.test]
description = "pytest (needs the qc env: pyranges1, Python >= 3.12)"
cmd = "pytest tests -q"

[tasks.hooks-install]
description = "install the git pre-commit hook"
cmd = "pre-commit install"

[tasks.hooks]
description = "run every pre-commit hook over all files"
cmd = "pre-commit run --all-files"

[tasks.check]
description = "all local checks"
depends-on = ["check-bash", "check-py", "lint"]
