# ChromBPNet configuration — igvf3_cardiomyocyte
#
#   export DATASET=igvf3_cardiomyocyte
#   cd workflows/SLURM && sbatch 01.0.preprocess_peaks.sh
#
# This file is the whole configuration. Machine-specific paths (conda envs,
# where the references live) are environment variables, not config — see
# config/README.md.

# Identifier for this dataset. It is used verbatim in every output filename and
# in the run metadata, so keep it short and filesystem-safe. It also supplies
# the default for bias_dataset (whose reads train the Tn5 bias model).
dataset_name: igvf3_cardiomyocyte

# Peaks to train on. Step 01 blacklist-filters this and writes the 10-column
# narrowPeak chrombpnet wants (-p).
regions: "${DATASET_ROOT}/igvf3_cardiomyocyte/data/peaks/igvf3_cardiomyocyte_all_peaks.bed"

# ATAC or DNASE (-d).
assay: ATAC

# The signal. Its kind is taken from the extension, so there is no second key to
# keep in sync:
#   .bam                          -> -ibam
#   .tagAlign[.gz]                -> -itag
#   .fragments.tsv.gz / .tsv.gz   -> -ifrag
#   .bw / .bigWig                 -> used directly as the prepared bigwig
#
# A bigwig is NOT a chrombpnet training input. Supplying one works here because
# the pipeline hands a prepared bigwig straight to training, skipping the
# conversion — so it must be the SAME QUANTITY chrombpnet would have produced:
#
#   per-base Tn5 INSERTION counts (bedtools genomecov -bg -5, i.e. 5' ends only),
#   with the shift normalised to +4/-4 for ATAC (0/+1 for DNASE).
#
# chrombpnet's own auxiliary/data_unstranded.bw satisfies both: reads_to_bigwig
# detects whatever shift the reads already carry and applies (4-detected) to
# reach +4/-4. Reusing one from another chrombpnet run is safe.
#
# A bigwig from deeptools bamCoverage or similar is NOT safe: that is full read
# COVERAGE, not 5' insertion counts, which is a different signal entirely — and
# it is unshifted. Nothing here can detect either mistake; it will train and be
# wrong. If in doubt, give the reads and let 00.0 build the bigwig.
#
# This file is never copied or modified. Point it at your data where it already
# lives; 00.0 writes only derived files, under output_dir.
signal_path: "${DATASET_ROOT}/igvf3_cardiomyocyte/data/fragments/igvf3_cardiomyocyte_atac_fragments.tsv.gz"

# Filter reads to chr1-22,X,Y,M before converting. Needed whenever the reads
# carry scaffolds, because bedtools genomecov fails on contigs missing from
# chrom.sizes. Set false if they are already clean, to skip a full pass.
filter_main_chroms: true

# Tn5 shift ALREADY PRESENT in your reads, as (plus, minus). The pileup adjusts
# from this to chrombpnet's +4/-4 (ATAC) or 0/+1 (DNASE) convention.
#
# Setting it is the normal path: the pileup itself needs no genome sequence, so
# with these two values 00.0 requires no FASTA and no pyfaidx at all.
#
# Common cases:
#   0, 0     raw alignments, no Tn5 correction applied
#   4, -5    already Tn5-corrected the conventional way (e.g. 10x CellRanger
#            ATAC fragments) -> adjustment becomes 0, +1
#
# Leave BOTH unset to auto-detect instead, which reads sequence around cut
# sites and therefore does require `genome_fa` and pyfaidx. Detection is a
# one-off: run it once, then write the answer here.
plus_shift: 4
minus_shift: -5

# Everything the pipeline writes goes under here.
output_dir: "${DATASET_ROOT}/igvf3_cardiomyocyte/results"

# Label; becomes part of every output filename.
peak_type: all

# Use ["0"] for a quick single-fold test run.
folds: ["0", "1", "2", "3", "4"]

# Bias sweep (03.0). Positional: bias_factors[i] pairs with bias_suffixes_sweep[i].
# The array is len(bias_sweep_folds) x len(bias_factors) GPU jobs; uncomment
# bias_sweep_folds to pilot on fewer folds first. `cli.py config validate`
# prints the --array range.
bias_factors: ["0.5", "0.6", "0.7", "0.8"]
bias_suffixes_sweep: ["_05", "_06", "_07", "_08"]
# bias_sweep_folds: ["0"]

# Filled in by hand after 03.1 writes selected_bias_per_fold.tsv.
fold_bias_suffix:
  "0": _08
  "1": _08
  "2": _06
  "3": _08
  "4": _07
