# ChromBPNet configuration — template. Every path below is a placeholder.
# To add a dataset, see config/README.md.

# Identifier for this dataset. Used verbatim in every output filename and in the
# run metadata, so keep it short and filesystem-safe. It also supplies the
# default for bias_dataset (whose reads train the Tn5 bias model).
#
# Keep this equal to the folder name: `DATASET=<name>` selects the folder, while
# this names the outputs, so if they differ you get outputs you did not expect.
dataset_name: example_dataset

# Peaks to train on. Step 01 blacklist-filters this and writes the 10-column
# narrowPeak chrombpnet wants (-p).
regions: "/path/to/peaks.bed"

# ATAC or DNASE (-d).
assay: ATAC

# The signal. Its kind is taken from the extension, so there is no second key to
# keep in sync:
#   .bam                          -> -ibam
#   .tagAlign[.gz]                -> -itag
#   .fragments.tsv.gz / .tsv.gz   -> -ifrag
#   .bw / .bigWig                 -> used directly as the prepared bigwig
#
# A bigwig is NOT a chrombpnet training input. Supplying one works here because
# the pipeline hands a prepared bigwig straight to training, skipping the
# conversion — so it must be the SAME QUANTITY chrombpnet would have produced:
#
#   per-base Tn5 INSERTION counts (bedtools genomecov -bg -5, i.e. 5' ends only),
#   with the shift normalised to +4/-4 for ATAC (0/+1 for DNASE).
#
# chrombpnet's own auxiliary/data_unstranded.bw satisfies both: reads_to_bigwig
# detects whatever shift the reads already carry and applies (4-detected) to
# reach +4/-4. Reusing one from another chrombpnet run is safe.
#
# A bigwig from deeptools bamCoverage or similar is NOT safe: that is full read
# COVERAGE, not 5' insertion counts, which is a different signal entirely — and
# it is unshifted. Nothing here can detect either mistake; it will train and be
# wrong. If in doubt, give the reads and let 00.0 build the bigwig.
#
# This file is never copied or modified. Point it at your data where it already
# lives; 00.0 writes only derived files, under output_dir.
signal_path: "/path/to/reads.fragments.tsv.gz"

# Filter reads to chr1-22,X,Y,M before converting. Needed whenever the reads
# carry scaffolds, because bedtools genomecov fails on contigs missing from
# chrom.sizes. Set false if they are already clean, to skip a full pass.
filter_main_chroms: true

# Tn5 shift ALREADY PRESENT in your reads, as (plus, minus). The pileup adjusts
# from this to chrombpnet's +4/-4 (ATAC) or 0/+1 (DNASE) convention.
#
# Setting it is the normal path: the pileup itself needs no genome sequence, so
# with these two values 00.0 requires no FASTA and no pyfaidx at all.
#
# Common cases:
#   0, 0     raw alignments, no Tn5 correction applied
#   4, -5    already Tn5-corrected the conventional way (e.g. 10x CellRanger
#            ATAC fragments) -> adjustment becomes 0, +1
#
# Leave BOTH unset to auto-detect instead, which reads sequence around cut
# sites and therefore does require `genome_fa` and pyfaidx. Detection is a
# one-off: run it once, then write the answer here.
plus_shift: 0
minus_shift: 0

# ── Shared references ─────────────────────────────────────────────────────────
# Where the genome, chrom.sizes, blacklist and motif DB live. This is also where
# `cli.py download-references` installs them, so one path both fetches and reads.
#
#   pixi run -e qc python src/cli.py download-references --dataset my_dataset
#
# Defaults to $REFERENCE_ROOT, then the lab copy. Set it here to make the config
# self-contained, or leave it out and use the environment variable.
# reference_root: /path/to/Data
#
# Individual files are derived from reference_root and rarely need setting. Any
# of them can be overridden for this dataset alone -- e.g. a mouse sample in a
# human project, or a genome that is not the IGVF build:
# genome_fa:        /path/to/genome.fa
# chrom_sizes:      /path/to/genome.chrom.sizes
# chrom_sizes_main: /path/to/genome.chrom.sizes.main.tsv
# blacklist:        /path/to/blacklist.bed.gz
# ref_db_meme:      /path/to/motifs.meme.txt

# Everything the pipeline writes goes under here.
output_dir: "/path/to/results"

# Label; becomes part of every output filename.
peak_type: all

# Use ["0"] for a quick single-fold test run.
folds: ["0", "1", "2", "3", "4"]

# GC-matched negatives (01.0) and the QC that compares against them (02.0).
# All four are ChromBPNet's own defaults; they are listed because the negatives
# are training data, so the seed is what makes a run reproducible. Every run
# records the values it used regardless of whether they are set here.
# nonpeak_seed: 1234        # -s   passed to `chrombpnet prep nonpeaks`
# neg_to_pos_ratio: 2       # -npr negatives per peak in train/valid (test is 1:1)
# nonpeak_stride: 1000      # -st  genome-wide GC bin stride
# qc_compare_window: 1000   # fixed window for the peak-vs-background comparison

# Drop peaks whose signal falls below this quantile of the experiment's OWN
# genome-wide windows (00.1). Off by default. Depth-independent: both sides are
# the same signal, so a deeper library lifts the peaks and the background
# together.
#
# It matters far beyond the peaks it removes. chrombpnet anchors EVERY bias
# threshold in the 03.0 sweep to quantile(peak_counts, 0.01), so a handful of
# background-level peaks drag the whole sweep down. On the d0 test dataset the
# weakest 1% of peaks sat at the 40.6th percentile of genome windows -- weaker
# than most of the genome -- and dropping 1.8% of peaks moved q01 from 4 to 17.
#
# 0.75 drops ~1.8% on d0; 0.50 is the conservative choice at ~1.0%; 0.95 is too
# aggressive at ~23%. Needs 00.0's bigwig, so 00.0 must run first.
# peak_min_signal_quantile: 0.75

# Start from a peak caller's narrowPeak instead of a region BED (00.1): set
# `regions` to the 10-column narrowPeak and every row becomes a window of this
# width centred on its OWN summit (column 10), one per summit -- MACS2
# --call-summits writes several rows for a multi-summit region, and each gets a
# window. 1000 = bases summit-500 .. summit+499. Optionally keep q <= a
# threshold (column 9, -log10 q as MACS2 writes it). Both off by default:
# without them `regions` is a plain BED whose summit is its midpoint.
# peak_summit_window: 1000
# peak_max_qvalue: 0.01

# Bias sweep (03.0). Positional: bias_factors[i] pairs with bias_suffixes_sweep[i].
# The array is len(bias_sweep_folds) x len(bias_factors) GPU jobs; uncomment
# bias_sweep_folds to pilot on fewer folds first. `cli.py config validate`
# prints the --array range.
bias_factors: ["0.5", "0.6", "0.7", "0.8"]
bias_suffixes_sweep: ["_05", "_06", "_07", "_08"]

# Batch size for `chrombpnet bias train` (03.0). Unset = chrombpnet's default,
# 64. A different size trains a different model, so it goes to its own
# directory (bias_model<suffix>_bs<N>/) and 03.1 does not select among those.
# BIAS_BATCH_SIZE in the environment overrides this for a one-off test.
# bias_batch_size: 128

# Cap the full-model training (04.0) for a pipeline TEST. Unset = chrombpnet's
# default of 50 epochs with early stopping, which takes hours. A capped model
# is written where the real one would be (04.1/04.3 read it there), and the
# run records max_epochs; retrain with --force for a real model.
# FULL_MODEL_EPOCHS in the environment overrides this.
# full_model_epochs: 2
# bias_sweep_folds: ["0"]

# Filled in by hand after 03.1 writes selected_bias_per_fold.tsv.
fold_bias_suffix:
  "0": ""
  "1": ""
  "2": ""
  "3": ""
  "4": ""
